#
# SerialTCPd configuration
#
# Copy to S:serialtcp.conf, or pass a path: SerialTCPd DH0:bbs/serialtcp.conf
#
# One directive per line. '#' or ';' starts a comment. Unknown directives are
# reported and ignored, so a config from a newer version still starts.
#

# How many virtual modems to create. Each one is a unit of serialtcp.device:
# nodes 4 gives you units 0, 1, 2 and 3.
#
# Only create as many as you will actually run BBS nodes on -- each costs
# roughly 680 bytes plus its two buffers (see buffer-size below).
nodes 4

# TCP port to accept incoming calls on.
#
# There is ONE port for ALL nodes. A caller connects here and is routed to
# whichever node is free; they do not need to know which node they land on.
# If every node is busy they get the busy-message below and are disconnected.
#
# Repeat the directive to listen on more than one port (up to 8 listeners
# in total, counting listen-node below).
listen 23
# listen 2323

# Give one unit its own private number, instead of the shared pool.
#
#     listen-node <port> <unit>
#
# Callers on that port only ever reach that unit. If it is busy they get the
# busy message, or wait for that unit specifically -- they are never diverted
# onto a pooled node, because they dialled a particular line on purpose.
#
# Giving a unit its own number RESERVES it: pool callers are no longer sent
# there, because landing somebody on a line another caller dialled directly
# would defeat the point. You do not need outbound-only as well.
#
# This is how telser.device works for every unit; here it is opt-in per unit,
# so you can pool most nodes and reserve one.
#
# Binding a port to a unit that does not exist, or to one marked
# outbound-only, is reported loudly at startup rather than failing quietly.
# listen-node 2400 3

# Bind to a specific interface. Leave commented out to accept on all of them.
# bind 192.168.1.50

# Speak the telnet protocol (option negotiation, IAC escaping), which is what
# any normal telnet client or BBS list expects.
#
# Set to off for a raw 8-bit TCP pipe with no protocol at all -- useful for
# custom clients, but ordinary telnet clients will show stray control bytes.
telnet on

# Speed reported in the CONNECT message, and the default if the BBS never
# sends SDCMD_SETPARAMS. Purely cosmetic: nothing is rate limited.
answer-baud 38400

# Default value of S register 0, the auto-answer ring count.
#
# 1 means answer on the first ring, which is what you want for an unattended
# BBS. 0 means never answer automatically -- the BBS must send ATA itself.
#
# The BBS can override this at any time with ATS0=n in its init string, and
# most will.
auto-answer 1

# How many rings to deliver before giving up on a call nobody answers.
# At roughly one ring every three seconds, 8 rings is about 24 seconds.
rings 8

# Milliseconds to wait between the BBS's ATA and the CONNECT it gets back.
# 0, the default, answers immediately.
#
# A real modem is silent for seconds while it trains, and some BBS software
# relies on that: C-Net 3 clears its serial input just after sending ATA, so an
# instant CONNECT is thrown away with the cleared input and the call times out.
# Delaying CONNECT puts it after the clear. 5000 is enough for C-Net.
#
# If the caller hangs up during the delay, the BBS gets NO CARRIER rather than
# silence, so its ATA is always answered.
connect-delay 0

# Per-node buffer size in bytes, each direction. 512 to 16384.
#
# 2048 is ample: at 38400 baud the BBS drains under 4K/sec while the daemon
# loops far faster, so this only has to absorb scheduling jitter. Raising it
# costs 2 x this figure x nodes of RAM and buys nothing.
buffer-size 2048

# Units excluded from the incoming pool.
#
# A node listed here is never offered an incoming call, even when it is idle.
# Use it for a unit you drive yourself from a terminal program to dial out --
# without this, a caller could land on the line you are sitting on.
#
# Accepts a list, and the directive may be repeated:
#     outbound-only 3
#     outbound-only 2,3
#     outbound-only 2 3
#
# Dialling out from an excluded unit works exactly as normal. Only incoming
# calls are affected. If you exclude every node, nothing can ever answer and
# the daemon says so loudly at startup.
#
# Commented out by default: every node answers.
# outbound-only 3

# ------------------------------------------------------------------------
# What happens when every node is in use
# ------------------------------------------------------------------------

# busy   Send the busy message and hang up. What a real modem does, and the
#        default so that behaviour does not change under you.
# queue  Hold the caller until a node frees up, then put them through
#        automatically. They are served oldest first.
# ask    Put it to the caller: wait, or call back later.
when-busy busy

# How many callers may wait at once. Beyond this they get the busy message
# and are dropped, exactly as with when-busy busy.
# Each waiting caller costs about 220 bytes.
queue-max 8

# Give up on a waiting caller after this many seconds and disconnect them
# with the queue-giveup-message. 0 means wait forever.
# 600 is ten minutes.
queue-timeout 600

# How often to check whether a waiting caller's position has changed, in
# seconds. They are only told when the number actually moves, so this is not
# a "message every minute" setting. 0 disables position notices entirely.
queue-notify 60

# With when-busy ask, how long to wait for an answer before giving up and
# dropping them. Minimum 5.
ask-timeout 30

# What a caller sees when every node is busy and they are being turned away.
# \r and \n are understood.
# Set to an empty string, or set busy-message-enabled off, to just drop the
# connection silently.
busy-message "\r\nAll lines are currently in use. Please try again later.\r\n"
busy-message-enabled on

# The question asked when when-busy is set to ask.
# Y, y or a bare Return means wait; N or n means hang up.
ask-message "\r\nAll lines are currently in use.\r\nWould you like to wait for the next free line? [Y/n] "

# Shown once, when a caller joins the queue.
queue-message "\r\nAll lines are busy. You are now waiting for the next free line.\r\nStay connected and you will be put through automatically.\r\n"

# The position notice. %N is replaced with their place in the queue.
# It is NOT a printf format: %s, %d and so on are left alone, so you cannot
# crash the daemon with a stray percent sign.
queue-position-message "\r\nStill waiting -- you are number %N in the queue.\r\n"

# Shown when queue-timeout runs out.
queue-giveup-message "\r\nSorry, no line became free in time. Please try again later.\r\n"

# ------------------------------------------------------------------------
# Queue position honesty  (a joke; off unless you turn it on)
# ------------------------------------------------------------------------
#
# off      Tell the caller their real position. THE DEFAULT.
# inflate  The phone-tree classic: start higher than the truth and creep
#          upward every time you tell them, so waiting looks like it is
#          making things worse.
# random   Mostly honest, but pads the number now and then -- which is more
#          unsettling than lying every single time.
#
# This is COSMETIC ONLY. Whatever the caller is told, they are still served
# strictly in arrival order: the lie cannot reorder the queue, delay anyone,
# or change who gets the next free line. The log always records the true
# position alongside what the caller was told.
#
# Leave it off unless you want the joke.
queue-lie off

# Where 'inflate' starts counting from.
queue-lie-start 3

# Percentage of notices that 'random' fibs on. 0 is honest, 100 always lies.
queue-lie-chance 50

# Log file. Comment out to log to the console only.
log T:serialtcp.log
